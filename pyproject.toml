[project]
name = "clearvoice-hermes-plugin"
version = "0.3.2"
description = "ClearVoice — privacy-first push-to-talk speech clarity bridge for Hermes Agent."
requires-python = ">=3.10"
dependencies = [
    # Local, on-device speech synthesis for English (Phonon 31m, Apache-2.0 weights).
    "ptts>=0.6.0,<0.7",
    # Local synthesis for every other language (MIT runtime, per-voice models).
    "piper-tts>=1.8,<2",
    # Local speech recognition. All three are optional at runtime: the plugin
    # degrades to a plain-language "local model missing" state instead of
    # failing to load.
    "faster-whisper>=1.2.1,<1.3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Optional phonemizers some Piper voices need. Neither is installed by default:
# both are only needed by the language that uses them.
ja = ["pyopenjtalk>=0.4"]                    # Japanese (builds from source)
th = ["tltk>=1.10", "pandas>=2", "requests>=2", "unicode-rbnf>=2"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
