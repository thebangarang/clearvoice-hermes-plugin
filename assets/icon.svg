<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="ClearVoice">
  <title>ClearVoice</title>
  <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- held microphone -->
    <rect x="9" y="2.5" width="6" height="10" rx="3"/>
    <path d="M6.2 11a5.8 5.8 0 0 0 11.6 0"/>
    <path d="M12 16.8v3.2"/>
