name: clearvoice
display_name: ClearVoice
version: 0.2.0
manifest_version: 2
description: >
  Privacy-first push-to-talk speech-clarity bridge, in 17 languages. You speak
  naturally into a push-to-talk button; ClearVoice transcribes the clip locally,
  shows a clear sentence you can edit or reject, and speaks it aloud with an
  on-device voice (Phonon 31m for English, Piper for the other 16 languages,
  including French, Spanish, German, Arabic, Hindi, Japanese, Chinese, Korean,
  Thai and Vietnamese). Audio is captured only while the button is held, is never
  written to disk, and is discarded when the utterance is finished. No telemetry,
  no account, no profile, no background listening. Cloud speech (Gradium) is
  opt-in, off by default, and needs the user's own API key.
license: MIT
author: Kevin L. (AITurn)
homepage: https://github.com/thebangarang/clearvoice-hermes-plugin
tags: [accessibility, speech, tts, stt, privacy, local-first, multilingual]
requires_hermes: ">=0.22.0"
provides_tools:
  - clearvoice_speak
provides_hooks: []
config_schema:
  language:
    type: str
    choices: [en, fr, de, es, pt, it, nl, pl, ru, tr, ar, hi, ja, zh, ko, th, vi]
    default: en
    label: Language
    description: "What you speak and what ClearVoice speaks back. English uses Phonon; the other languages use a Piper voice."
  voice:
    type: str
    default: ""
    label: Voice
    description: "Voice name: a Phonon catalog name for English (e.g. Zoey, Juniper), or a Piper voice key for other languages (e.g. fr_FR-siwis-medium). Empty = that language's default. The pane lists what is available."
  rewrite_style:
    type: str
    choices: [courteous, literal, verbatim]
    default: courteous
    label: Rewrite style
    description: "courteous = 'Could you move the appointment to Tuesday, please?'; literal = your words in a plain order; verbatim = exactly what was recognised."
  stt_backend:
    type: str
    choices: [local, gradium]
    default: local
    label: Speech-to-text backend
    description: "local = faster-whisper on this machine (offline). gradium = Gradium cloud, needs allow_cloud and an API key."
  tts_backend:
    type: str
    choices: [auto, phonon, piper, gradium]
    default: auto
    label: Text-to-speech backend
    description: "auto = Phonon for English, Piper for every other language (both offline). gradium = cloud, needs allow_cloud and an API key."
  whisper_model:
    type: str
    default: ""
    label: Local STT model
    description: "Optional override: tiny, base, small, medium (a .en variant only hears English, so it is swapped for you when the language is not English). Empty = chosen from the language."
  gradium_voice_id:
    type: str
    default: ""
    label: Gradium voice id
    description: "Voice id for Gradium TTS, from the Gradium voice library. Only used when the Gradium TTS backend is selected."
  gradium_api_key:
    type: secret
    env: CLEARVOICE_GRADIUM_API_KEY
    label: Gradium API key
    description: "Your own Gradium key. Stored in .env, never in config.yaml, never logged or displayed."
  allow_cloud:
    type: bool
    default: false
    label: Allow cloud speech (Gradium)
    description: "Off by default. When on, a session may send the chosen audio or text to Gradium's API - only if the Gradium backend is selected for that step."
